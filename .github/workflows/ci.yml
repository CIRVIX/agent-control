name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tooling
        run: python -m pip install --upgrade build hatchling
      - name: Install Node workspace
        run: npm ci --ignore-scripts
      - name: Canonical version check
        run: npm run verify:version
      - name: Claim consistency (site vs shipped code)
        run: npm run verify:claims
      - name: Node tests
        run: npm test
      - name: Python tests
        working-directory: packages/cirvix-python
        run: python -m unittest discover -s tests -v
      - name: Adversarial fixtures
        run: npm run verify:adversarial
      - name: Package build and clean-install smoke test
        run: npm run verify:package
      - name: Python artifacts
        run: python -m build packages/cirvix-python --outdir .artifacts/python
      - name: Package integrity and provenance checks
        run: |
          npm run verify:license
          npm run verify:public
          python packages/cirvix-python/check_artifacts.py .artifacts/python
      - name: Secret scan
        # gitleaks-action@v2 requires a paid license key for organizations.
        # Until GITLEAKS_LICENSE is configured, fall back to the free
        # gitleaks binary so the scan itself never silently disappears.
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o /tmp/gl.tgz
          mkdir -p /tmp/gl && tar -xzf /tmp/gl.tgz -C /tmp/gl
          /tmp/gl/gitleaks detect --source . --redact

  site-build:
    # The marketing site had no CI at all, which is how a checkout button could
    # ship on a page whose own FAQ says checkout does not exist. This job proves
    # the site compiles and that its published claims match the shipped package.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install workspace
        run: npm ci --ignore-scripts
      - name: Claim consistency
        run: npm run verify:claims
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
