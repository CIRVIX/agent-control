[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cirvix"
version = "0.3.0"
description = "Runtime governance for AI agents — evaluate every tool call against policy before it executes."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Cirvix" }]
keywords = ["ai", "agents", "security", "policy", "governance", "llm", "mcp"]

# Zero runtime dependencies, deliberately and permanently. A security package
# that drags in a transitive dependency tree is asking to become the
# supply-chain incident it exists to prevent — the same reason the Node package
# has none.
dependencies = []

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Security",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://cirvix.com/"
Documentation = "https://cirvix.com/sdks.html"

[tool.hatch.build]
exclude = ["**/__pycache__", "**/*.pyc", "**/.env*", "**/*.pem", "**/*.key"]

[tool.hatch.build.targets.wheel]
packages = ["cirvix"]

[tool.hatch.build.targets.sdist]
# The conformance fixture ships with the source distribution so the suite that
# proves this engine agrees with the Node one can be run by anyone auditing it,
# not only by us.
#
# `check_artifacts.py` ships for the same reason and one more: it is IMPORTED by
# tests/test_artifacts.py, so leaving it out produced an sdist whose own suite
# could not run. Found by verify-python-package.py, which extracts the built
# sdist and runs the tests from there — the artifact we were about to publish
# failed its own audit. An inventory nobody can re-run is not evidence.
include = ["cirvix", "tests", "README.md", "hatch_build.py", "check_artifacts.py"]

[tool.hatch.build.targets.sdist.force-include]
"../conformance/policy-conformance.json" = "tests/fixtures/policy-conformance.json"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"
