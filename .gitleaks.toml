# gitleaks configuration for the public engine repository.
#
# Secret-shaped fixtures are intentionally used in tests. The current allowlist
# excludes ALL Node and Python test paths, not a single file or selected rules.
# Consequently this configured history scan cannot establish that historical
# test literals were harmless. Review those separately with redacted output.

title = "cirvix-agent-control public repo scan"

[extend]
useDefault = true

[allowlist]
description = "Secret-shaped test fixtures (dummy literals, not credentials)"
paths = [
  '''packages/agent-control/test/.*''',
  '''packages/cirvix-python/tests/.*''',
]
