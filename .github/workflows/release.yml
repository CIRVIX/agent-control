name: Release packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # publish-npm gates on `needs.build.outputs.creds`. A job's step outputs are
    # NOT visible to dependent jobs unless the job republishes them here, so
    # without this mapping that expression is the empty string, the gate can
    # never be true, and publish-npm skips on every tag while the run stays
    # green — which is exactly what happened to v0.1.0: PyPI published, npm did
    # not, and nothing failed. Note the key below is `npm`, which is what the
    # step actually writes.
    outputs:
      creds: ${{ steps.creds.outputs.npm }}
    steps:
      - name: Require npm credentials for tag publication
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: test -n "$NPM_TOKEN"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade build hatchling
      - run: npm ci --ignore-scripts
      - run: npm run verify:version
      - run: npm test
      - name: Python tests
        working-directory: packages/cirvix-python
        run: python -m unittest discover -s tests -v
      - run: npm run verify:adversarial
      - run: npm run verify:license
      - run: npm run verify:public
      - name: Build and verify Node artifact
        run: |
          mkdir -p dist/node
          CIRVIX_PACKAGE_OUTPUT_DIR="$GITHUB_WORKSPACE/dist/node" npm run verify:package
      - name: Build Python package
        run: python -m build packages/cirvix-python --outdir dist/python
      - name: Verify Python artifact contents
        run: python packages/cirvix-python/check_artifacts.py dist/python
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist
      - name: Report credential availability
        id: creds
        run: |
          # The secrets context cannot be read from a job-level `if:`, so the
          # build job reports what exists and the publish jobs gate on that.
          if [ -n "$NPM_TOKEN" ]; then echo "npm=available" >> "$GITHUB_OUTPUT"; else echo "npm=missing" >> "$GITHUB_OUTPUT"; fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-npm:
    # Credential gate: runs only when NPM_TOKEN is configured AND this is a
    # tag push. A manual dispatch is a dry run of build; a tag without
    # credentials produces green build + artifacts but no false "publish".
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag' && needs.build.outputs.creds == 'available'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - name: Publish Node package
        run: npm publish dist/node/*.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - name: Publish Python package with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/python
          skip-existing: false

  release:
    needs: [build, publish-npm, publish-pypi]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
