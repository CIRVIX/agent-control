name: Release packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade build hatchling
      - run: npm ci
      - run: npm run verify:version
      - run: npm test
      - run: npm run verify:adversarial
      - run: npm run verify:license
      - run: npm run verify:public
      - name: Build Node package
        working-directory: packages/agent-control
        run: npm pack --pack-destination ../../dist/node
      - name: Build Python package
        run: python -m build packages/cirvix-python --outdir dist/python
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist

  publish-npm:
    # Credential gate: runs only when the NPM_TOKEN secret exists. A tag push
    # without credentials still produces a green build + artifacts, never a
    # half-published release or a falsely "live" publish job.
    needs: build
    if: ${{ secrets.NPM_TOKEN != '' }}
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - name: Publish Node package
        working-directory: packages/agent-control
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - name: Publish Python package with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/python

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
